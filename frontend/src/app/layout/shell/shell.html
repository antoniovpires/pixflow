<div class="relative min-h-dvh overflow-hidden">
  <!-- ambient glow -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0">
    <div class="absolute -top-40 left-1/2 size-[42rem] -translate-x-1/2 rounded-full bg-brand-500/12 blur-[120px]"></div>
    <div class="absolute top-1/2 -right-40 size-[28rem] rounded-full bg-brand-700/10 blur-[120px]"></div>
  </div>

  <header class="sticky top-0 z-20 border-b border-white/6 bg-ink-950/70 backdrop-blur-xl">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-5">
      <a routerLink="/" aria-label="PixFlow home"><app-logo /></a>

      <nav class="flex items-center gap-1" aria-label="Main">
        <a
          routerLink="/"
          routerLinkActive="bg-white/8 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-2 rounded-full px-4 py-2 text-sm font-medium text-slate-400 transition hover:text-white"
        >
          <app-icon name="home" [size]="18" /> <span class="hidden sm:inline">Home</span>
        </a>
      </nav>

      <button type="button" class="btn-ghost !px-4 !py-2" (click)="logout()">
        <app-icon name="log-out" [size]="16" />
        <span class="hidden sm:inline">Log out</span>
      </button>
    </div>
  </header>

  <main class="relative mx-auto max-w-5xl px-5 py-10">
    <router-outlet />
  </main>
</div>
