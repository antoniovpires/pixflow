spring.application.name=pixflow-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/pixflow
spring.datasource.username=pixflow
spring.datasource.password=pixflow
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

pixflow.jwt.secret=${JWT_SECRET}
pixflow.jwt.expiration-minutes=15

# Loads backend/.env (KEY=value lines) when it exists, like Laravel. Real environment variables still win.
spring.config.import=optional:file:.env[.properties]
